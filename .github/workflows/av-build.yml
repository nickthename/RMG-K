name: AV build comparison

on:
  push:
    branches: [av-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: 9fc7aa2cb9a06ab7ec47a1a6b217bb3b652cf52e
  APP_VERSION: v0.9.14
  # Git for Windows and MSYS2 Git must agree about checkout line endings.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  windows:
    if: github.repository == 'nickthename/RMG-K'
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment: [current-control, current-old-crt]
    steps:
      - name: Check out test harness
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false

      - name: Check out identical release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Set up MSYS2 host tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: minimal
          update: true
          cache: false
          install: make git curl diffutils

      - name: Install pinned package variant
        shell: msys2 {0}
        env:
          AV_ENVIRONMENT: ${{ matrix.environment }}
        run: bash harness/Source/Script/AvBuild/InstallLocalPackages.sh

      - name: Build and collect scan samples
        shell: msys2 {0}
        env:
          AV_ENVIRONMENT: ${{ matrix.environment }}
          CCACHE_DISABLE: '1'
        run: bash harness/Source/Script/AvBuild/BuildSamples.sh

      - name: Collect available diagnostics
        if: always()
        shell: msys2 {0}
        run: |
          mkdir -p results/diagnostics
          pacman -Q > results/diagnostics/packages-after.txt
          cp harness/Source/Script/AvBuild/*.tsv results/diagnostics/
          if [ -f source/Build/Release/CMakeCache.txt ]; then
            cp source/Build/Release/CMakeCache.txt results/diagnostics/
          fi
          git -C source status --porcelain > results/diagnostics/source-status.txt

      - name: Upload executables for scanning
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: av-${{ matrix.environment }}-executables-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/scan/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: av-${{ matrix.environment }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: av-${{ matrix.environment }}-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/Bin/Release/
          if-no-files-found: warn
          retention-days: 30
